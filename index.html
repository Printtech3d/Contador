<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Contador de Acessos</title>
</head>
<body>

    <h1>Bem-vindo</h1>
    <p>Total de acessos:</p>
    <h2 id="contador">Carregando...</h2>

    <script>
        const namespace = "Printtech3d";
        const key = "Palavra-diaria";

        fetch(`https://api.countapi.xyz/hit/${namespace}/${key}`)
            .then(res => res.json())
            .then(data => {
                document.getElementById("contador").innerText = data.value;

            .catch(() => {
                document.getElementById("contador").innerText = "Erro ao carregar";
            });
    </script>


</body>
</html>
