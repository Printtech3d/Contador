<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Contador de Acessos</title>
</head>
<body>

    <h1>Bem-vindo</h1>
    <p>Total de acessos:</p>
    <h2 id="contador">Carregando...</h2>

    <script>
        fetch("https://api.counterapi.dev/v1/Printtech3d/Palavra-diaria/up")
            .then(response => response.json())
            .then(data => {
                document.getElementById("contador").innerText = data.count;
            })
            .catch(() => {
                document.getElementById("contador").innerText = "Erro";
            });
    </script>

</body>
</html>
